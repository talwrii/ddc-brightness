[package]
name = "ddc-brightness"
version = "1.2.1"
edition = "2021"
description = "This has been merged into lumix"
license = "MIT"
repository = "https://github.com/talwrii/ddc-brightness"
keywords = ["brightness", "ddc", "control", "monitor", "cli"]

[dependencies]
# Powerful, modern CLI argument parser
clap = { version = "4.4", features = ["derive"] }

# Safe, cross-platform DDC/CI (monitor control) library
ddc-hi = "0.4"

# We keep the release profile optimizations, they are excellent!
[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
panic = "abort"
